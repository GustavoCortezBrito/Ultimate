name: Update Mercado Livre Prices

on:
  schedule:
    # Executa 1 vez por semana (toda segunda-feira às 03:00 UTC / 00:00 BRT)
    - cron: '0 3 * * 1'
  workflow_dispatch: # Permite disparar manualmente na aba Actions do GitHub

permissions:
  contents: write

jobs:
  update-prices:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Execute Price Updater
        run: node scripts/update-prices-ci.js

      - name: Commit and push if changed
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add src/data/ml_prices.json
          if git diff --staged --quiet; then
            echo "Nenhuma alteração de preço detectada."
          else
            git commit -m "chore(cron): atualizar preços do Mercado Livre (semanal) [skip ci]"
            git push
          fi



